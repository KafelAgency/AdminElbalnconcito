<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — EL BALCONCITO Rockola</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <style>
    :root{
      /* Paleta OLED + oro */
      --black:#000000;
      --surface:#0a0a0b;
      --surface-2:#141416;
      --line:rgba(255,255,255,.08);
      --line-gold:rgba(255,194,51,.28);
      --gold:#FFC233;
      --gold-2:#F0A500;
      --ink:#F6F4F0;
      --muted:#9C978D;
      --accent-green:#3DDC84;
      --accent-red:#FF6B6B;
      --accent-amber:#FFC233;
      --accent-blue:#FFC233;
      --bg-dark:#000000;
      --bg-card:#0a0a0b;
      --text-warm:#F6F4F0;
      --text-muted:#9C978D;
      --font-display:'Inter',sans-serif;
      --font-body:'Inter',sans-serif;
      --ease:cubic-bezier(.16,1,.3,1);
      --z-toast:80;
      color-scheme:dark;
    }

    /* ---- Modo claro ---- */
    [data-theme="light"]{
      --black:#F5F4F0;
      --surface:#FFFFFF;
      --surface-2:#F0EDEA;
      --line:rgba(0,0,0,.1);
      --line-gold:rgba(176,120,0,.3);
      --gold:#B07800;
      --gold-2:#8A5C00;
      --ink:#1A1814;
      --muted:#706C62;
      --accent-green:#1E7A47;
      --accent-red:#C0392B;
      --accent-amber:#B07800;
      color-scheme:light;
    }


    *{margin:0;padding:0;box-sizing:border-box}

    html,body{
      font-family:var(--font-body);
      background:var(--black);
      color:var(--ink);
      line-height:1.6;
      -webkit-font-smoothing:antialiased;
    }

    body{padding:2rem 1.25rem 4rem;min-height:100vh}

    /* ---------- Marca ---------- */
    header{
      text-align:center;padding-bottom:2rem;margin-bottom:2.5rem;position:relative;
      animation:fadeInDown .6s var(--ease);
    }
    header::after{
      content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);
      width:min(100%,560px);height:1px;
      background:linear-gradient(90deg,transparent,var(--line-gold),transparent);
    }

    .logo-container{margin-bottom:1.1rem;display:flex;justify-content:center}

    .logo{
      display:block;width:100%;max-width:340px;height:auto;
      filter:drop-shadow(0 8px 28px rgba(255,194,51,.22));
    }

    h1{
      font-family:var(--font-display);font-size:1.5rem;font-weight:800;
      letter-spacing:-.02em;margin-bottom:.5rem;color:var(--ink);
    }

    .subtitle{
      font-size:.72rem;color:var(--muted);font-weight:500;
      text-transform:uppercase;letter-spacing:.28em;
    }

    /* ---------- Rejilla ---------- */
    .container{
      max-width:1240px;margin:0 auto;
      display:grid;grid-template-columns:1fr;gap:2.5rem;
    }
    @media (min-width:768px){.container{grid-template-columns:1fr 1fr}}
    @media (min-width:1024px){.container{grid-template-columns:repeat(2,1fr)}}

    .section{
      display:flex;flex-direction:column;
      animation:slideInUp .6s var(--ease) backwards;
    }
    .section:nth-child(1){animation-delay:.05s}
    .section:nth-child(2){animation-delay:.12s}
    .section:nth-child(3){animation-delay:.19s}

    .section-title{
      font-family:var(--font-display);font-size:1.05rem;font-weight:800;
      letter-spacing:-.015em;color:var(--ink);
      text-transform:none;
      display:flex;align-items:center;gap:.75rem;
      padding-bottom:.75rem;margin-bottom:1.25rem;
      border-bottom:1px solid var(--line);
    }
    .section-title::before{
      content:'';display:inline-block;flex-shrink:0;
      width:5px;height:1.25rem;background:var(--gold);border-radius:1px;
    }

    /* ---------- Tarjeta de canción ---------- */
    .song-item{
      background:var(--surface);
      border:1px solid var(--line);
      border-left:3px solid var(--gold);
      border-radius:0 .6rem .6rem 0;
      padding:1.1rem 1.25rem;margin-bottom:.75rem;
      display:flex;flex-direction:column;gap:.9rem;
      transition:background .3s var(--ease),transform .3s var(--ease);
    }
    .song-item:hover{background:var(--surface-2);transform:translateX(3px)}

    .song-info{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem}

    .song-title{
      font-size:1rem;font-weight:700;letter-spacing:-.01em;
      color:var(--ink);word-break:break-word;
    }

    .song-artist{
      display:inline-block;width:fit-content;
      font-size:.65rem;font-weight:700;color:var(--gold);
      text-transform:uppercase;letter-spacing:.12em;
      border:1px solid var(--line-gold);border-radius:2rem;
      padding:.2rem .65rem;
    }

    .song-time{font-size:.72rem;color:var(--muted)}

    .song-position{
      font-size:.8rem;font-weight:700;letter-spacing:.04em;
      color:var(--gold);background:none;padding:0;width:auto;
    }

    /* ---------- Acciones ---------- */
    .song-actions{display:flex;gap:.5rem;flex-wrap:wrap}

    .btn{
      flex:1;min-width:100px;
      padding:.65rem .75rem;
      border-radius:.4rem;
      font-family:var(--font-body);font-size:.7rem;font-weight:700;
      text-transform:uppercase;letter-spacing:.1em;
      cursor:pointer;background:transparent;border:1px solid;
      display:flex;align-items:center;justify-content:center;gap:.4rem;
      transition:background .25s var(--ease),color .25s var(--ease),transform .25s var(--ease);
    }
    .btn:active{transform:translateY(1px)}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

    .btn-approve{border-color:rgba(61,220,132,.4);color:var(--accent-green)}
    .btn-approve:hover{background:var(--accent-green);color:#000}

    .btn-reject{border-color:rgba(255,107,107,.4);color:var(--accent-red)}
    .btn-reject:hover{background:var(--accent-red);color:#000}

    .btn-play{background:var(--gold);border-color:var(--gold);color:#000}
    .btn-play:hover{background:#fff;border-color:#fff}

    /* ---------- Vacío ---------- */
    .empty-state{
      text-align:center;padding:2.5rem 1rem;
      color:#5f5b55;font-size:.85rem;
      border:1px dashed var(--line);border-radius:.6rem;
    }

    /* ---------- Aviso flotante ---------- */
    .status-message{
      position:fixed;top:1rem;right:1rem;z-index:var(--z-toast);
      background:#141416;
      border:1px solid var(--line);border-left:3px solid var(--gold);
      color:var(--ink);
      padding:.9rem 1.25rem;border-radius:.5rem;
      font-size:.88rem;font-weight:500;
      box-shadow:0 24px 48px rgba(0,0,0,.75);
      animation:slideInRight .3s var(--ease);
      max-width:300px;
    }
    .status-message.success{border-left-color:var(--accent-green);color:var(--accent-green)}
    .status-message.error{border-left-color:var(--accent-red);color:var(--accent-red)}
    .status-message.info{border-left-color:var(--gold);color:var(--gold)}

    /* ---------- Estado de conexión ---------- */
    .connection-status{
      position:fixed;bottom:1rem;left:1rem;z-index:var(--z-toast);
      display:flex;align-items:center;gap:.5rem;
      font-size:.72rem;color:var(--muted);
      background:rgba(0,0,0,.85);
      padding:.45rem .9rem;border-radius:2rem;
      border:1px solid var(--line);
    }

    .status-dot{
      width:6px;height:6px;border-radius:50%;flex-shrink:0;
      background:var(--accent-green);
    }
    .status-dot.disconnected{background:var(--accent-red);animation:none}

    /* ---------- Animaciones ---------- */
    @keyframes fadeInDown{
      from{opacity:0;transform:translateY(-20px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes slideInUp{
      from{opacity:0;transform:translateY(30px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes fadeInUp{
      from{opacity:0;transform:translateY(10px)}
      to{opacity:1;transform:translateY(0)}
    }
    @keyframes fadeOutUp{
      from{opacity:1;transform:translateY(0) scale(1)}
      to{opacity:0;transform:translateY(-20px) scale(.95)}
    }
    @keyframes fadeOutDown{
      from{opacity:1;transform:translateY(0) scale(1)}
      to{opacity:0;transform:translateY(20px) scale(.95)}
    }
    @keyframes slideInRight{
      from{opacity:0;transform:translateX(30px)}
      to{opacity:1;transform:translateX(0)}
    }
    @keyframes pulse{
      0%,100%{opacity:1}
      50%{opacity:.5}
    }

    .song-item.removing{animation:fadeOutUp .3s var(--ease) forwards}
    .song-item.approving{animation:fadeOutUp .3s var(--ease) forwards}

    @media (max-width:480px){
      body{padding:1.5rem 1rem 4rem}
      .logo{max-width:260px}
    }

    @media (prefers-reduced-motion:reduce){
      *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
    }
  
    /* ---- Toggle tema ---- */
    .theme-toggle{
      position:fixed;top:1rem;right:1rem;z-index:100;
      width:2.5rem;height:2.5rem;
      background:var(--surface-2);
      border:1px solid var(--line);
      border-radius:50%;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;line-height:1;
      transition:background .3s var(--ease),border-color .3s var(--ease),transform .3s var(--ease);
      box-shadow:0 2px 12px rgba(0,0,0,.25);
    }
    .theme-toggle:hover{transform:scale(1.1);border-color:var(--line-gold)}
    .theme-toggle:active{transform:scale(.95)}

  
    /* Etiqueta de mesa en tarjetas */
    .song-mesa{
      font-size:.72rem;font-weight:600;color:var(--muted);
      display:flex;align-items:center;gap:.3rem;
      margin-top:.25rem;
    }
  
    /* ===== HISTORIAL POR MESA ===== */
    .historial-wrapper{
      max-width:1240px;margin:3rem auto 0;
    }

    .historial-header{
      display:flex;align-items:center;justify-content:space-between;
      flex-wrap:wrap;gap:1rem;
      padding-bottom:.75rem;margin-bottom:1.75rem;
      border-bottom:1px solid var(--line);
    }

    .historial-title{
      font-family:var(--font-display);font-size:1.05rem;font-weight:800;
      letter-spacing:-.015em;
      display:flex;align-items:center;gap:.75rem;
    }
    .historial-title::before{
      content:'';display:inline-block;flex-shrink:0;
      width:5px;height:1.25rem;background:var(--muted);border-radius:1px;
    }

    .historial-meta{
      font-size:.7rem;color:var(--muted);font-weight:500;
      text-transform:uppercase;letter-spacing:.12em;
    }

    .btn-clear-hist{
      font-family:var(--font-body);font-size:.7rem;font-weight:700;
      text-transform:uppercase;letter-spacing:.1em;cursor:pointer;
      background:transparent;
      border:1px solid rgba(255,107,107,.4);color:var(--accent-red);
      border-radius:.4rem;padding:.5rem .9rem;
      transition:background .25s var(--ease),color .25s var(--ease);
    }
    .btn-clear-hist:hover{background:var(--accent-red);color:#fff}

    .historial-grid{
      display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:1.25rem;
    }

    .mesa-card{
      background:var(--surface);border:1px solid var(--line);
      border-radius:.6rem;overflow:hidden;
    }

    .mesa-card-head{
      display:flex;align-items:center;justify-content:space-between;
      padding:.75rem 1rem;
      background:var(--surface-2);border-bottom:1px solid var(--line);
    }

    .mesa-card-name{
      font-size:.85rem;font-weight:700;letter-spacing:.02em;color:var(--ink);
      display:flex;align-items:center;gap:.5rem;
    }

    .mesa-card-count{
      font-family:var(--font-display);font-size:1.1rem;font-weight:800;
      color:var(--gold);letter-spacing:-.02em;
    }

    .hist-item{
      display:flex;align-items:flex-start;justify-content:space-between;
      gap:.75rem;padding:.7rem 1rem;
      border-bottom:1px solid var(--line);
      transition:background .2s;
    }
    .hist-item:last-child{border-bottom:none}
    .hist-item:hover{background:var(--surface-2)}

    .hist-cancion{
      font-size:.88rem;font-weight:600;color:var(--ink);
      line-height:1.3;word-break:break-word;
    }
    .hist-genero{
      font-size:.62rem;font-weight:700;color:var(--gold);
      text-transform:uppercase;letter-spacing:.1em;
      border:1px solid var(--line-gold);border-radius:2rem;
      padding:.15rem .55rem;white-space:nowrap;margin-top:.3rem;display:inline-block;
    }
    .hist-estado{
      font-size:.62rem;font-weight:700;text-transform:uppercase;
      letter-spacing:.1em;white-space:nowrap;padding-top:.15rem;
    }
    .hist-estado.sono{color:var(--accent-green)}
    .hist-estado.rechazada{color:var(--accent-red)}
    .hist-hora{font-size:.65rem;color:var(--muted);margin-top:.2rem}

    .hist-empty{
      text-align:center;padding:2rem 1rem;
      color:#5f5b55;font-size:.82rem;
      border:1px dashed var(--line);border-radius:.6rem;
    }

    .btn-clear-mesa{
      width:100%;
      font-family:var(--font-body);font-size:.68rem;font-weight:700;
      text-transform:uppercase;letter-spacing:.1em;cursor:pointer;
      background:transparent;
      border:none;border-top:1px solid var(--line);
      color:var(--muted);
      padding:.6rem 1rem;text-align:center;
      transition:background .2s,color .2s;
    }
    .btn-clear-mesa:hover{background:rgba(255,107,107,.08);color:var(--accent-red)}

    .historial-footer{
      margin-top:1rem;padding:.6rem 0;
      text-align:center;font-size:.68rem;color:var(--muted);
      text-transform:uppercase;letter-spacing:.15em;
    }

  </style>
</head>

  <!-- ==== BLOQUE ADITIVO KAFEL: toggle claro/oscuro (aislado, no toca lógica original) ==== -->
  <script>
    (function () {
      var KEY = 'kafel-theme';
      var btn = document.getElementById('themeToggle');
      var root = document.documentElement;

      function aplicar(tema) {
        root.setAttribute('data-theme', tema);
        btn.textContent = tema === 'light' ? '\u2600\ufe0f' : '\ud83c\udf19';
        btn.setAttribute('aria-label', tema === 'light' ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro');
      }

      // Cargar preferencia guardada; si no existe, respetar preferencia del SO
      var guardado = localStorage.getItem(KEY);
      var preferencia = guardado || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      aplicar(preferencia);

      btn.addEventListener('click', function () {
        var actual = root.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        var nuevo  = actual === 'light' ? 'dark' : 'light';
        aplicar(nuevo);
        localStorage.setItem(KEY, nuevo);
      });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // Configuración
    const SUPABASE_URL = 'https://funrnjtplyrzfumqzewo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ1bnJuanRwbHlyemZ1bXF6ZXdvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzNjE3ODUsImV4cCI6MjEwMzkzNzc4NX0.uOGsPepiqgpPYF8oFSozLsPHRIyaoJ9PS69fcOEVkwg';

    let supabaseClient = null;
    let allSongs = [];

    // Elementos DOM
    const statusMessage = document.getElementById('statusMessage');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const pendingesList = document.getElementById('pendingesList');
    const queueList = document.getElementById('queueList');
    const playingList = document.getElementById('playingList');

    // Mostrar estado
    function showStatus(message, type = 'info') {
      statusMessage.textContent = message;
      statusMessage.className = `status-message ${type}`;
      statusMessage.style.display = 'block';
      setTimeout(() => {
        statusMessage.style.display = 'none';
      }, 4000);
    }

    // Actualizar estado de conexión
    function setConnectionStatus(connected) {
      if (connected) {
        statusDot.classList.remove('disconnected');
        statusText.textContent = 'Conectado';
      } else {
        statusDot.classList.add('disconnected');
        statusText.textContent = 'Desconectado';
      }
    }

    // Inicializar Supabase
    function initSupabase() {
      if (!supabaseClient && window.supabase) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        console.log('✓ Supabase inicializado');
        setConnectionStatus(true);
        return true;
      }
      return false;
    }

    // Traer canciones
    async function fetchSongs() {
      if (!supabaseClient) return;

      try {
        const { data, error } = await supabaseClient
          .from('solicitudes')
          .select('*')
          .order('creada_en', { ascending: true });

        if (error) throw error;

        allSongs = data || [];
        renderSections();
        setConnectionStatus(true);
      } catch (err) {
        console.error('Error al traer canciones:', err);
        setConnectionStatus(false);
      }
    }

    // Renderizar secciones
    function renderSections() {
      renderPending();
      renderQueue();
      renderPlaying();
    }

    // Renderizar pendientes
    function renderPending() {
      const pending = allSongs.filter(s => s.estado === 'pendiente');

      if (pending.length === 0) {
        pendingesList.innerHTML = '<div class="empty-state">✓ Todas aprobadas</div>';
        return;
      }

      pendingesList.innerHTML = '';
      pending.forEach((song, idx) => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.setAttribute('data-song-id', song.id);
        item.innerHTML = `
          <div class="song-info">
            <div class="song-title">${escapeHtml(song.cancion)}</div>
            <div class="song-artist">${escapeHtml(song.artista)}</div>
            ${song.mesa ? `<div class="song-mesa">📍 ${escapeHtml(song.mesa)}</div>` : ''}
            <div class="song-time">${formatTime(song.creada_en)}</div>
          </div>
          <div class="song-actions">
            <button class="btn btn-approve" onclick="approveSong('${song.id}')">✓ Aprobar</button>
            <button class="btn btn-reject" onclick="rejectSong('${song.id}')">✕ Rechazar</button>
          </div>
        `;
        pendingesList.appendChild(item);
      });
    }

    // Renderizar cola
    function renderQueue() {
      const queue = allSongs.filter(s => s.estado === 'en_cola');

      if (queue.length === 0) {
        queueList.innerHTML = '<div class="empty-state">— Cola vacía</div>';
        return;
      }

      queueList.innerHTML = '';
      queue.forEach((song, idx) => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.setAttribute('data-song-id', song.id);
        item.innerHTML = `
          <div class="song-info">
            <div class="song-position">#${idx + 1}</div>
            <div class="song-title">${escapeHtml(song.cancion)}</div>
            <div class="song-artist">${escapeHtml(song.artista)}</div>
            ${song.mesa ? `<div class="song-mesa">📍 ${escapeHtml(song.mesa)}</div>` : ''}
          </div>
          <div class="song-actions">
            <button class="btn btn-play" onclick="playNow('${song.id}')">✓ Ya sonó</button>
          </div>
        `;
        queueList.appendChild(item);
      });
    }

    // Renderizar en sonando
    function renderPlaying() {
      const playing = allSongs.filter(s => s.estado === 'sonando');

      if (playing.length === 0) {
        playingList.innerHTML = '<div class="empty-state">⊘ Nada sonando</div>';
        return;
      }

      playingList.innerHTML = '';
      playing.forEach(song => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.setAttribute('data-song-id', song.id);
        item.innerHTML = `
          <div class="song-info">
            <div class="song-title" style="color: var(--accent-green); font-size: 1.1rem;">♪ ${escapeHtml(song.cancion)}</div>
            <div class="song-artist">${escapeHtml(song.artista)}</div>
            ${song.mesa ? `<div class="song-mesa">📍 ${escapeHtml(song.mesa)}</div>` : ''}
            <div class="song-time">${formatTime(song.creada_en)}</div>
          </div>
          <div class="song-actions">
            <button class="btn btn-play" onclick="markPlayed('${song.id}')">✓ Ya sonó</button>
          </div>
        `;
        playingList.appendChild(item);
      });
    }

    // Acciones
    async function approveSong(id) {
      if (!supabaseClient) return;
      try {
        // Animar tarjeta antes de actualizar
        const item = document.querySelector(`[data-song-id="${id}"]`);
        if (item) {
          item.classList.add('approving');
          await new Promise(r => setTimeout(r, 300));
          item.remove(); // Remover del DOM físicamente
        }

        const { error } = await supabaseClient
          .from('solicitudes')
          .update({ estado: 'en_cola' })
          .eq('id', id);
        if (error) throw error;
        showStatus('✓ Canción aprobada', 'success');
        fetchSongs();
      } catch (err) {
        showStatus('✗ Error al aprobar', 'error');
        console.error(err);
      }
    }

    async function rejectSong(id) {
      if (!supabaseClient) return;
      try {
        // Animar tarjeta antes de actualizar
        const item = document.querySelector(`[data-song-id="${id}"]`);
        if (item) {
          item.classList.add('removing');
          await new Promise(r => setTimeout(r, 300));
          item.remove(); // Remover del DOM físicamente
        }

        const { error } = await supabaseClient
          .from('solicitudes')
          .update({ estado: 'rechazada' })
          .eq('id', id);
        if (error) throw error;

        // Remover del array local para evitar que vuelva a aparecer en el polling
        allSongs = allSongs.filter(s => s.id !== id);

        showStatus('✗ Canción rechazada', 'success');
      } catch (err) {
        showStatus('✗ Error al rechazar', 'error');
        console.error(err);
      }
    }

    async function playNow(id) {
      if (!supabaseClient) return;
      try {
        // Animar tarjeta antes de actualizar
        const item = document.querySelector(`[data-song-id="${id}"]`);
        if (item) {
          item.classList.add('approving');
          await new Promise(r => setTimeout(r, 300));
          item.remove(); // Remover del DOM físicamente
        }

        // Marcar anteriores como sonadas
        const playing = allSongs.filter(s => s.estado === 'sonando');
        for (const song of playing) {
          await supabaseClient
            .from('solicitudes')
            .update({ estado: 'sono' })
            .eq('id', song.id);
        }

        // Marcar como sonada directamente (la columna "Sonando" no está visible)
        const { error } = await supabaseClient
          .from('solicitudes')
          .update({ estado: 'sono' })
          .eq('id', id);
        if (error) throw error;

        // Remover del array local
        allSongs = allSongs.filter(s => s.id !== id);

        showStatus('✓ Marcada como sonada', 'success');
        fetchSongs();
        fetchHistorial();
      } catch (err) {
        showStatus('✗ Error', 'error');
        console.error(err);
      }
    }

    async function markPlayed(id) {
      if (!supabaseClient) return;
      try {
        // Animar tarjeta antes de actualizar
        const item = document.querySelector(`[data-song-id="${id}"]`);
        if (item) {
          item.classList.add('removing');
          await new Promise(r => setTimeout(r, 300));
          item.remove(); // Remover del DOM físicamente
        }

        const { error } = await supabaseClient
          .from('solicitudes')
          .update({ estado: 'sono' })
          .eq('id', id);
        if (error) throw error;

        // Remover del array local para evitar que vuelva a aparecer en el polling
        allSongs = allSongs.filter(s => s.id !== id);

        showStatus('✓ Marcada como sonada', 'success');
      } catch (err) {
        showStatus('✗ Error', 'error');
        console.error(err);
      }
    }

    // Utilidades
    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function formatTime(isoString) {
      const date = new Date(isoString);
      return date.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
    }

    // Iniciar
    const waitForSupabase = setInterval(() => {
      if (initSupabase()) {
        clearInterval(waitForSupabase);
        fetchSongs(); // Carga inicial
        setInterval(fetchSongs, 1000); // Polling cada 1 segundo para actualizaciones en tiempo real
        fetchHistorial(); // Carga inicial del historial
        setInterval(fetchHistorial, 30000); // Actualizar historial cada 30 segundos
      }
    }, 100);

    // ===== HISTORIAL POR MESA (bloque aditivo, no toca lógica original) =====
    let historialData = [];

    async function fetchHistorial() {
      if (!supabaseClient) return;
      try {
        const { data, error } = await supabaseClient
          .from('historial_solicitudes')
          .select('*')
          .order('creada_en', { ascending: false });
        if (error) throw error;
        historialData = data || [];
        renderHistorial();
      } catch (err) {
        console.error('Error al traer historial:', err);
      }
    }

    function renderHistorial() {
      const grid = document.getElementById('historialGrid');
      const meta = document.getElementById('historialMeta');

      if (historialData.length === 0) {
        grid.innerHTML = '<div class="hist-empty">Sin historial en las últimas 12 horas</div>';
        meta.textContent = '0 canciones';
        return;
      }

      // Agrupar por mesa
      const porMesa = {};
      historialData.forEach(h => {
        const mesa = h.mesa || 'Sin mesa';
        if (!porMesa[mesa]) porMesa[mesa] = [];
        porMesa[mesa].push(h);
      });

      // Ordenar mesas: primero Mesa 1-11, luego Barra 1-8
      const ordenadas = Object.keys(porMesa).sort((a, b) => {
        const tipoA = a.startsWith('Mesa') ? 0 : a.startsWith('Barra') ? 1 : 2;
        const tipoB = b.startsWith('Mesa') ? 0 : b.startsWith('Barra') ? 1 : 2;
        if (tipoA !== tipoB) return tipoA - tipoB;
        const numA = parseInt(a.replace(/\D/g,'')) || 0;
        const numB = parseInt(b.replace(/\D/g,'')) || 0;
        return numA - numB;
      });

      grid.innerHTML = '';
      ordenadas.forEach(mesa => {
        const canciones = porMesa[mesa];
        const card = document.createElement('div');
        card.className = 'mesa-card';
        const emoji = mesa.startsWith('Barra') ? '🍺' : '🪑';
        card.innerHTML = `
          <div class="mesa-card-head">
            <span class="mesa-card-name">${emoji} ${escapeHtml(mesa)}</span>
            <span class="mesa-card-count">${canciones.length}</span>
          </div>
          ${canciones.map(h => `
            <div class="hist-item">
              <div>
                <div class="hist-cancion">${escapeHtml(h.cancion)}</div>
                <span class="hist-genero">${escapeHtml(h.artista)}</span>
                <div class="hist-hora">${formatTime(h.completada_en || h.creada_en)}</div>
              </div>
              <div>
                <div class="hist-estado ${h.estado}">${h.estado === 'sono' ? '✓ Sonó' : '✕ Rechazada'}</div>
              </div>
            </div>
          `).join('')}
          <button class="btn-clear-mesa" data-mesa="${escapeHtml(mesa)}">🗑 Borrar ${escapeHtml(mesa)}</button>
        `;
        grid.appendChild(card);
      });

      meta.textContent = `${historialData.length} canciones · ${ordenadas.length} mesas/barras`;
    }

    // Borrar historial completo
    document.getElementById('btnClearHist').addEventListener('click', async function() {
      if (!supabaseClient) return;
      if (!confirm('¿Borrar todo el historial? Esta acción no se puede deshacer.')) return;
      try {
        const { error } = await supabaseClient
          .from('historial_solicitudes')
          .delete()
          .neq('id', '00000000-0000-0000-0000-000000000000');
        if (error) throw error;
        historialData = [];
        renderHistorial();
        showStatus('✓ Historial borrado', 'success');
      } catch (err) {
        showStatus('✗ Error al borrar historial', 'error');
        console.error(err);
      }
    });

    // Borrar historial de una mesa específica (delegación en el grid)
    document.getElementById('historialGrid').addEventListener('click', async function(e) {
      const btn = e.target.closest('.btn-clear-mesa');
      if (!btn || !supabaseClient) return;
      const mesa = btn.dataset.mesa;
      if (!confirm(`¿Borrar el historial de ${mesa}?`)) return;
      try {
        const { error } = await supabaseClient
          .from('historial_solicitudes')
          .delete()
          .eq('mesa', mesa);
        if (error) throw error;
        historialData = historialData.filter(h => h.mesa !== mesa);
        renderHistorial();
        showStatus(`✓ Historial de ${mesa} borrado`, 'success');
      } catch (err) {
        showStatus('✗ Error al borrar', 'error');
        console.error(err);
      }
    });
  </script>
</body>
</html>
